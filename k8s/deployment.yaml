apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluid-app
  namespace: default
  labels:
    app: fluid-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fluid-app
  # Zero-downtime rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: fluid-app
    spec:
      containers:
        - name: fluid-app
          image: himanshumandloi307/fluid-ai-devops:latest  # replaced by CI/CD
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          # Liveness probe: restart container if app is stuck/deadlocked
          # Problem it solves: catches hung processes that are alive but not serving
          # Tradeoff: too aggressive settings cause restart loops
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe: only send traffic when Redis is connected
          # Problem it solves: prevents 503 errors during startup or Redis reconnect
          # Tradeoff: pod won't receive traffic until Redis is ready (expected behavior)
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: fluid-app-service
  namespace: default
spec:
  selector:
    app: fluid-app
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
  type: NodePort
